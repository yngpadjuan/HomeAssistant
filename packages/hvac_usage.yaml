# Replace climate.YOUR_CLIMATE_ENTITY with your actual climate entity ID throughout this file.

template:
  - sensor:
      - name: HVAC Action
        unique_id: hvac_action_tracker
        state: "{{ state_attr('climate.hallway', 'hvac_action') | default('idle') }}"

      - name: HVAC Set Temperature High
        unique_id: hvac_set_temperature_high
        device_class: temperature
        unit_of_measurement: "°F"
        state_class: measurement
        state: >
          {% set t = state_attr('climate.hallway', 'target_temp_high') %}
          {% set t_single = state_attr('climate.hallway', 'temperature') %}
          {{ (t if t is not none else t_single) | float(0) }}

      - name: HVAC Set Temperature Low
        unique_id: hvac_set_temperature_low
        device_class: temperature
        unit_of_measurement: "°F"
        state_class: measurement
        state: >
          {{ state_attr('climate.hallway', 'target_temp_low') | float(65) }}

      - name: HVAC Total Active Hours Last 24h
        unique_id: hvac_total_active_hours_last_24h
        unit_of_measurement: h
        state_class: measurement
        icon: mdi:clock-check
        state: >
          {{ (states('sensor.hvac_heating_hours_rolling_24h') | float(0)
            + states('sensor.hvac_cooling_hours_rolling_24h') | float(0)) | round(2) }}
      
      - name: AC Cost per kWh
        unique_id: ac_cost_per_kwh
        unit_of_measurement: "$"
        state_class: measurement
        state: >
              {{ ((states('input_number.ac_condenser_btu_hr') | float(1)) 
              * (states('sensor.hvac_total_increasing_cooling_hours') | float(1)) 
              * (states('input_number.electricity_rate') | float(1))) 
              / (states('number.seer_rating_kw') | float(1)) }}

      - name: Furnace Cost per h
        unique_id: furnace_cost_per_h
        unit_of_measurement: "$"
        state_class: measurement
        state: >
              {{ ((((states('input_number.input_number.furnace_btu_h') | float(1)) 
              / ((states('input_number.afue_efficiency') | float(1)) / 100))
              / 100000) 
              * (states('input_number.cost_per_therm') | float(1))) }}


sensor:
  - platform: history_stats
    name: HVAC Heating Hours Today
    entity_id: sensor.hvac_action
    state: "heating"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Cooling Hours Today
    entity_id: sensor.hvac_action
    state: "cooling"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Fan Running Hours Today
    entity_id: sensor.hvac_action
    state: "fan"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Drying Hours Today
    entity_id: sensor.hvac_action
    state: "drying"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Preheating Hours Today
    entity_id: sensor.hvac_action
    state: "preheating"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Active Hours Today
    entity_id: sensor.hvac_action
    state: "idle"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Heating Hours Rolling 24h
    entity_id: sensor.hvac_action
    state: "heating"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: HVAC Cooling Hours Rolling 24h
    entity_id: sensor.hvac_action
    state: "cooling"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"
  
  - platform: history_stats
    unique_id: hvac_total_increasing_cooling_hours
    name: HVAC Total Increasing Cooling Hours
    entity_id: sensor.hvac_action
    state: "cooling"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
    state_class: total_increasing

  - platform: history_stats
    unique_id: hvac_total_increasing_heating_hours
    name: HVAC Total Increasing Heating Hours
    entity_id: sensor.hvac_action
    state: "heating"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
    state_class: total_increasing

