blueprint:
  name: Predictive Temperature Control
  description: >
    Runs hourly to scan the weather forecast up to a configurable number of hours ahead.
    Uses a thermal model (T_inside = T_outside + insulation_factor × (T_inside_current - T_outside_current))
    to estimate future indoor temperature for each forecast hour. Creates calendar events
    and sends notifications on days where predicted indoor temperature will fall outside
    the comfort range.
  author: yngpadjuan
  homeassistant:
    min_version: "2024.10.0"
  domain: automation
  input:
    hvac_entity:
      name: HVAC System
      description: "The climate entity to read current indoor temperature from."
      selector:
        entity:
          domain: climate

    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      description: "Current outdoor temperature sensor used as the baseline for the thermal model."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
          multiple: false

    input_mobile_app:
      name: Mobile App
      description: "Select the mobile app to receive notifications."
      selector:
        device:
          integration: mobile_app

    input_calendar:
      name: Calendar
      description: "The input calendar to add HVAC required events to."
      selector:
        entity:
          domain: calendar

    comfort_temp_high:
      name: Comfort Temperature (High)
      description: "The maximum comfortable predicted indoor temperature (°F)."
      default: 75
      selector:
        number:
          min: 50
          max: 95
          step: 0.5

    comfort_temp_low:
      name: Comfort Temperature (Low)
      description: "The minimum comfortable predicted indoor temperature (°F)."
      default: 65
      selector:
        number:
          min: 32
          max: 85
          step: 0.5

    insulation_factor:
      name: Insulation Factor
      description: >
        How well your home retains its temperature relative to outside conditions.
        A typical well-insulated home is around 1.5 - 2.5.
      default: 1.5
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.5

    lookahead_hours:
      name: Lookahead Hours
      description: "How many hours ahead to scan in the forecast. Most providers supply up to 72 hours."
      default: 48
      selector:
        number:
          min: 1
          max: 72
          step: 1
          unit_of_measurement: hours

trigger:
  - platform: time_pattern
    hours: "/1"

action:
  - variables:
      hvac_id: !input hvac_entity
      outdoor_sensor: !input outdoor_temp_sensor
      mobile_app: !input input_mobile_app
      calendar_id: !input input_calendar
      high_threshold: !input comfort_temp_high
      low_threshold: !input comfort_temp_low
      insulation: !input insulation_factor
      lookahead: !input lookahead_hours
  - variables:
      forecast: "{{ state_attr('sensor.hourly_forecast', 'forecast') }}"
      current_indoor: "{{ state_attr(hvac_id, 'current_temperature') | float(0) }}"
      current_outdoor: "{{ states(outdoor_sensor) | float(0) }}"
  - variables:
      daily_predictions: >
        {% set upcoming = forecast[:lookahead | int] %}
        {% set ns = namespace(days={}) %}
        {% for hour in upcoming %}
          {% set t_predicted = (hour.temperature | float + (insulation | float * (current_indoor - current_outdoor))) | round(1) %}
          {% set day = as_datetime(hour.datetime).strftime('%Y-%m-%d') %}
          {% if day in ns.days %}
            {% set existing = ns.days[day] %}
            {% set ns.days = dict(ns.days, **{day: {
                'high': [existing.high, t_predicted] | max,
                'low': [existing.low, t_predicted] | min
              }}) %}
          {% else %}
            {% set ns.days = dict(ns.days, **{day: {'high': t_predicted, 'low': t_predicted}}) %}
          {% endif %}
        {% endfor %}
        {{ ns.days }}
      cooling_days: >
        {% set ns = namespace(days=[]) %}
        {% for day, temps in daily_predictions.items() %}
          {% if temps.high > high_threshold | float %}
            {% set ns.days = ns.days + [{'date': day, 'high': temps.high, 'low': temps.low}] %}
          {% endif %}
        {% endfor %}
        {{ ns.days }}
      heating_days: >
        {% set ns = namespace(days=[]) %}
        {% for day, temps in daily_predictions.items() %}
          {% if temps.low < low_threshold | float %}
            {% set ns.days = ns.days + [{'date': day, 'high': temps.high, 'low': temps.low}] %}
          {% endif %}
        {% endfor %}
        {{ ns.days }}

  - repeat:
      for_each: "{{ cooling_days }}"
      sequence:
        - alias: "Check for existing cooling event"
          action: calendar.get_events
          target:
            entity_id: "{{ calendar_id }}"
          data:
            start_date_time: "{{ repeat.item.date }}T00:00:00"
            end_date_time: "{{ repeat.item.date }}T23:59:59"
          response_variable: existing_events
        - alias: "Create cooling event only if not already present"
          condition: template
          value_template: >
            {{ existing_events[calendar_id].events
               | selectattr('summary', 'eq', 'Cooling Required (Predicted)')
               | list | length == 0 }}
        - alias: "Create calendar event for predicted cooling day"
          action: calendar.create_event
          target:
            entity_id: "{{ calendar_id }}"
          data:
            summary: "Cooling Required (Predicted)"
            description: >
              Predicted indoor high: {{ repeat.item.high }}°F, low: {{ repeat.item.low }}°F.
              Comfort ceiling: {{ high_threshold }}°F (insulation factor: {{ insulation }}).
              Current indoor: {{ current_indoor }}°F, current outdoor: {{ current_outdoor }}°F.
            start_date: "{{ repeat.item.date }}"
            end_date: "{{ (as_datetime(repeat.item.date) + timedelta(days=1)).strftime('%Y-%m-%d') }}"

  - repeat:
      for_each: "{{ heating_days }}"
      sequence:
        - alias: "Check for existing heating event"
          action: calendar.get_events
          target:
            entity_id: "{{ calendar_id }}"
          data:
            start_date_time: "{{ repeat.item.date }}T00:00:00"
            end_date_time: "{{ repeat.item.date }}T23:59:59"
          response_variable: existing_events
        - alias: "Create heating event only if not already present"
          condition: template
          value_template: >
            {{ existing_events[calendar_id].events
               | selectattr('summary', 'eq', 'Heating Required (Predicted)')
               | list | length == 0 }}
        - alias: "Create calendar event for predicted heating day"
          action: calendar.create_event
          target:
            entity_id: "{{ calendar_id }}"
          data:
            summary: "Heating Required (Predicted)"
            description: >
              Predicted indoor high: {{ repeat.item.high }}°F, low: {{ repeat.item.low }}°F.
              Comfort floor: {{ low_threshold }}°F (insulation factor: {{ insulation }}).
              Current indoor: {{ current_indoor }}°F, current outdoor: {{ current_outdoor }}°F.
            start_date: "{{ repeat.item.date }}"
            end_date: "{{ (as_datetime(repeat.item.date) + timedelta(days=1)).strftime('%Y-%m-%d') }}"

  - condition: template
    value_template: "{{ cooling_days | length > 0 or heating_days | length > 0 }}"

  - alias: "Send forecast notification"
    action: notify.send_message
    target:
      device_id: "{{ mobile_app }}"
    data:
      title: "HVAC Prediction Update"
      message: >
        {% if cooling_days | length > 0 %}
        Cooling likely needed on {{ cooling_days | length }} day(s):
        {% for day in cooling_days %}{{ day.date }} (H:{{ day.high }}°F L:{{ day.low }}°F){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
        {% if heating_days | length > 0 %}
        Heating likely needed on {{ heating_days | length }} day(s):
        {% for day in heating_days %}{{ day.date }} (H:{{ day.high }}°F L:{{ day.low }}°F){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
        Current indoor: {{ current_indoor }}°F, outdoor: {{ current_outdoor }}°F.

mode: single
