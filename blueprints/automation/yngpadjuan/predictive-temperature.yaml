blueprint:
  name: Predictive Temperature Control
  description: >
    Runs hourly to scan the weather forecast up to a configurable number of hours ahead.
    Uses a thermal model (T_inside = T_outside + insulation_factor × (T_inside_current - T_outside_current))
    to estimate future indoor temperature for each forecast hour. Creates calendar events
    and sends notifications on days where predicted indoor temperature will fall outside
    the comfort range.
  author: yngpadjuan
  homeassistant:
    min_version: "2024.10.0"
  domain: automation
  input:
    hvac_entity:
      name: HVAC System
      description: "The climate entity to read current indoor temperature from."
      selector:
        entity:
          domain: climate

    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      description: "Current outdoor temperature sensor used as the baseline for the thermal model."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
          multiple: false

    input_mobile_app:
      name: Mobile App
      description: "Select the mobile app to receive notifications."
      selector:
        device:
          integration: mobile_app

    input_calendar:
      name: Calendar
      description: "The input calendar to add HVAC required events to."
      selector:
        entity:
          domain: calendar

    comfort_temp_high:
      name: Comfort Temperature (High)
      description: "The maximum comfortable predicted indoor temperature (°F)."
      default: 75
      selector:
        number:
          min: 50
          max: 95
          step: 0.5

    comfort_temp_low:
      name: Comfort Temperature (Low)
      description: "The minimum comfortable predicted indoor temperature (°F)."
      default: 65
      selector:
        number:
          min: 32
          max: 85
          step: 0.5

    insulation_factor:
      name: Insulation Factor
      description: >
        How well your home retains its temperature relative to outside conditions.
        0.0 = no insulation (indoor tracks outdoor exactly), 1.0 = perfect insulation
        (indoor never changes). A typical well-insulated home is around 0.3–0.6.
        Values above 1.0 are invalid and will produce unrealistic predictions.
      default: 0.4
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05

    lookahead_hours:
      name: Lookahead Hours
      description: "How many hours ahead to scan in the forecast. Most providers supply up to 72 hours."
      default: 48
      selector:
        number:
          min: 1
          max: 72
          step: 1
          unit_of_measurement: hours

trigger:
  - platform: time_pattern
    hours: "/1"

action:
  - variables:
      hvac_id: !input hvac_entity
      outdoor_sensor: !input outdoor_temp_sensor
      mobile_app: !input input_mobile_app
      calendar_id: !input input_calendar
      high_threshold: !input comfort_temp_high
      low_threshold: !input comfort_temp_low
      insulation: !input insulation_factor
      lookahead: !input lookahead_hours
  - variables:
      forecast: "{{ state_attr('sensor.hourly_forecast', 'forecast') }}"
      current_indoor: "{{ state_attr(hvac_id, 'current_temperature') | float(0) }}"
      current_outdoor: "{{ states(outdoor_sensor) | float(0) }}"
  - variables:
      cooling_windows: >
        {% set upcoming = forecast[:lookahead | int] %}
        {% set ns = namespace(windows=[], start=none, peak=none, end=none) %}
        {% for hour in upcoming %}
          {% set t_predicted = (hour.temperature | float + (insulation | float * (current_indoor - current_outdoor))) | round(1) %}
          {% set dt = as_datetime(hour.datetime) %}
          {% if t_predicted > high_threshold | float %}
            {% if ns.start is none %}
              {% set ns.start = dt %}
              {% set ns.peak = t_predicted %}
            {% else %}
              {% set ns.peak = [ns.peak, t_predicted] | max %}
            {% endif %}
            {% set ns.end = dt %}
          {% else %}
            {% if ns.start is not none %}
              {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'peak': ns.peak}] %}
              {% set ns.start = none %}
              {% set ns.peak = none %}
              {% set ns.end = none %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.start is not none %}
          {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'peak': ns.peak}] %}
        {% endif %}
        {{ ns.windows }}
      heating_windows: >
        {% set upcoming = forecast[:lookahead | int] %}
        {% set ns = namespace(windows=[], start=none, trough=none, end=none) %}
        {% for hour in upcoming %}
          {% set t_predicted = (hour.temperature | float + (insulation | float * (current_indoor - current_outdoor))) | round(1) %}
          {% set dt = as_datetime(hour.datetime) %}
          {% if t_predicted < low_threshold | float %}
            {% if ns.start is none %}
              {% set ns.start = dt %}
              {% set ns.trough = t_predicted %}
            {% else %}
              {% set ns.trough = [ns.trough, t_predicted] | min %}
            {% endif %}
            {% set ns.end = dt %}
          {% else %}
            {% if ns.start is not none %}
              {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'trough': ns.trough}] %}
              {% set ns.start = none %}
              {% set ns.trough = none %}
              {% set ns.end = none %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.start is not none %}
          {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'trough': ns.trough}] %}
        {% endif %}
        {{ ns.windows }}

  - repeat:
      for_each: "{{ cooling_windows }}"
      sequence:
        - alias: "Check for existing cooling event"
          action: calendar.get_events
          target:
            entity_id: "{{ calendar_id }}"
          data:
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"
          response_variable: existing_events
        - alias: "Create cooling event only if not already present"
          condition: template
          value_template: >
            {{ existing_events[calendar_id].events
               | selectattr('summary', 'eq', 'Cooling Required (Predicted)')
               | list | length == 0 }}
        - alias: "Create calendar event for predicted cooling window"
          action: calendar.create_event
          target:
            entity_id: "{{ calendar_id }}"
          data:
            summary: "Cooling Required (Predicted)"
            description: >
              Predicted indoor peak: {{ repeat.item.peak }}°F.
              Comfort ceiling: {{ high_threshold }}°F (insulation factor: {{ insulation }}).
              Current indoor: {{ current_indoor }}°F, current outdoor: {{ current_outdoor }}°F.
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"

  - repeat:
      for_each: "{{ heating_windows }}"
      sequence:
        - alias: "Check for existing heating event"
          action: calendar.get_events
          target:
            entity_id: "{{ calendar_id }}"
          data:
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"
          response_variable: existing_events
        - alias: "Create heating event only if not already present"
          condition: template
          value_template: >
            {{ existing_events[calendar_id].events
               | selectattr('summary', 'eq', 'Heating Required (Predicted)')
               | list | length == 0 }}
        - alias: "Create calendar event for predicted heating window"
          action: calendar.create_event
          target:
            entity_id: "{{ calendar_id }}"
          data:
            summary: "Heating Required (Predicted)"
            description: >
              Predicted indoor trough: {{ repeat.item.trough }}°F.
              Comfort floor: {{ low_threshold }}°F (insulation factor: {{ insulation }}).
              Current indoor: {{ current_indoor }}°F, current outdoor: {{ current_outdoor }}°F.
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"

  - condition: template
    value_template: "{{ cooling_windows | length > 0 or heating_windows | length > 0 }}"

  - alias: "Send forecast notification"
    action: notify.send_message
    target:
      device_id: "{{ mobile_app }}"
    data:
      title: "HVAC Prediction Update"
      message: >
        {% if cooling_windows | length > 0 %}
        Cooling likely needed during {{ cooling_windows | length }} window(s):
        {% for w in cooling_windows %}{{ as_datetime(w.start) | timestamp_custom('%-m/%-d %-I%p') }}–{{ as_datetime(w.end) | timestamp_custom('%-I%p') }} (peak {{ w.peak }}°F){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
        {% if heating_windows | length > 0 %}
        Heating likely needed during {{ heating_windows | length }} window(s):
        {% for w in heating_windows %}{{ as_datetime(w.start) | timestamp_custom('%-m/%-d %-I%p') }}–{{ as_datetime(w.end) | timestamp_custom('%-I%p') }} (trough {{ w.trough }}°F){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
        Current indoor: {{ current_indoor }}°F, outdoor: {{ current_outdoor }}°F.

mode: single
