blueprint:
  name: Predictive Temperature Control
  description: >
    Runs hourly to scan the weather forecast up to a configurable number of hours ahead.
    Uses Newton's Law of Cooling to simulate how indoor temperature gradually drifts toward
    outdoor temperature each hour. Applies a heat index adjustment when humidity is high.
    Creates timed calendar events and sends notifications when predicted indoor temperature
    will fall outside the comfort range.
  author: yngpadjuan
  homeassistant:
    min_version: "2024.10.0"
  domain: automation
  input:
    hvac_entity:
      name: HVAC System
      description: "The climate entity to read current indoor temperature from."
      selector:
        entity:
          domain: climate

    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      description: "Current outdoor temperature sensor used as the baseline for the thermal model."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
          multiple: false

    input_mobile_app:
      name: Mobile App
      description: "Select the mobile app to receive notifications."
      selector:
        device:
          integration: mobile_app

    input_calendar:
      name: Calendar
      description: "The input calendar to add HVAC required events to."
      selector:
        entity:
          domain: calendar

    comfort_temp_high:
      name: Set High Temperature
      description: "The configured indoor high temperature threshold (°F) above which cooling is predicted to be needed."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
          multiple: false

    comfort_temp_low:
      name: Set Low Temperature
      description: "The configured indoor low temperature threshold (°F) below which heating is predicted to be needed."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
          multiple: false

    thermal_rate_source:
      name: Thermal Rate Source
      description: >
        Choose how the thermal rate is determined.
        "Auto" uses sensor.observed_thermal_rate calculated by AppDaemon from your
        home's actual history. "Manual" uses the fixed value below.
      default: auto
      selector:
        select:
          options:
            - auto
            - manual

    thermal_rate_manual:
      name: Thermal Rate (Manual)
      description: >
        Used only when Thermal Rate Source is set to "manual".
        How quickly indoor temperature drifts toward outdoor temperature each hour.
        0.05 = very well insulated (~20 hours to equilibrate).
        0.15 = average home (~7 hours to equilibrate).
        0.30 = poorly insulated (~3 hours to equilibrate).
      default: 0.1
      selector:
        number:
          min: 0.01
          max: 0.5
          step: 0.01

    humidity_weight:
      name: Humidity Weight
      description: >
        How much forecast humidity amplifies the perceived indoor temperature when hot.
        0.0 = ignore humidity. 0.5 = moderate effect. 1.0 = full heat index effect.
        Only applied when predicted indoor temperature exceeds the comfort high threshold.
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.1

    lookahead_hours:
      name: Lookahead Hours
      description: "How many hours ahead to scan in the forecast. Most providers supply up to 72 hours."
      default: 48
      selector:
        number:
          min: 1
          max: 72
          step: 1
          unit_of_measurement: hours

trigger:
  - platform: time_pattern
    hours: "/1"

action:
  - variables:
      hvac_id: !input hvac_entity
      outdoor_sensor: !input outdoor_temp_sensor
      mobile_app: !input input_mobile_app
      calendar_id: !input input_calendar
      high_entity: !input comfort_temp_high
      low_entity: !input comfort_temp_low
      rate_source: !input thermal_rate_source
      rate_manual: !input thermal_rate_manual
      hum_weight: !input humidity_weight
      lookahead: !input lookahead_hours
  - variables:
      high_threshold: >
        {% if high_entity is string and high_entity | regex_match('^[a-z_]+\.[a-z0-9_]+$') %}
          {{ states(high_entity) | float(75) }}
        {% else %}
          {{ high_entity | float(75) }}
        {% endif %}
      low_threshold: >
        {% if low_entity is string and low_entity | regex_match('^[a-z_]+\.[a-z0-9_]+$') %}
          {{ states(low_entity) | float(65) }}
        {% else %}
          {{ low_entity | float(65) }}
        {% endif %}
  - variables:
      rate: >
        {% if rate_source == 'auto' %}
          {{ states('sensor.observed_thermal_rate') | float(rate_manual) }}
        {% else %}
          {{ rate_manual | float }}
        {% endif %}
  - variables:
      forecast: "{{ state_attr('sensor.hourly_forecast', 'forecast') }}"
      current_indoor: "{{ state_attr(hvac_id, 'current_temperature') | float(0) }}"
      current_outdoor: "{{ states(outdoor_sensor) | float(0) }}"
  - variables:
      cooling_windows: >
        {% set upcoming = forecast[:lookahead | int] %}
        {% set ns = namespace(t_indoor=current_indoor, windows=[], start=none, peak=none, end=none) %}
        {% for hour in upcoming %}
          {% set t_out = hour.temperature | float %}
          {% set humidity = hour.humidity | float(50) %}
          {% set ns.t_indoor = (ns.t_indoor + rate | float * (t_out - ns.t_indoor)) | round(2) %}
          {% set heat_index_adj = hum_weight | float * (humidity - 40) * 0.025 if humidity > 40 else 0 %}
          {% set t_feels = (ns.t_indoor + heat_index_adj) | round(1) %}
          {% set dt = as_datetime(hour.datetime) %}
          {% if t_feels > high_threshold | float %}
            {% if ns.start is none %}
              {% set ns.start = dt %}
              {% set ns.peak = t_feels %}
            {% else %}
              {% set ns.peak = [ns.peak, t_feels] | max %}
            {% endif %}
            {% set ns.end = dt %}
          {% else %}
            {% if ns.start is not none %}
              {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'peak': ns.peak}] %}
              {% set ns.start = none %}
              {% set ns.peak = none %}
              {% set ns.end = none %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.start is not none %}
          {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'peak': ns.peak}] %}
        {% endif %}
        {{ ns.windows }}
      heating_windows: >
        {% set upcoming = forecast[:lookahead | int] %}
        {% set ns = namespace(t_indoor=current_indoor, windows=[], start=none, trough=none, end=none) %}
        {% for hour in upcoming %}
          {% set t_out = hour.temperature | float %}
          {% set ns.t_indoor = (ns.t_indoor + rate | float * (t_out - ns.t_indoor)) | round(2) %}
          {% set dt = as_datetime(hour.datetime) %}
          {% if ns.t_indoor < low_threshold | float %}
            {% if ns.start is none %}
              {% set ns.start = dt %}
              {% set ns.trough = ns.t_indoor %}
            {% else %}
              {% set ns.trough = [ns.trough, ns.t_indoor] | min %}
            {% endif %}
            {% set ns.end = dt %}
          {% else %}
            {% if ns.start is not none %}
              {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'trough': ns.trough}] %}
              {% set ns.start = none %}
              {% set ns.trough = none %}
              {% set ns.end = none %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.start is not none %}
          {% set ns.windows = ns.windows + [{'start': ns.start.isoformat(), 'end': (ns.end + timedelta(hours=1)).isoformat(), 'trough': ns.trough}] %}
        {% endif %}
        {{ ns.windows }}

  - repeat:
      for_each: "{{ cooling_windows }}"
      sequence:
        - alias: "Check for existing cooling event"
          action: calendar.get_events
          target:
            entity_id: "{{ calendar_id }}"
          data:
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"
          response_variable: existing_events
        - alias: "Create cooling event only if not already present"
          condition: template
          value_template: >
            {{ existing_events[calendar_id].events
               | selectattr('summary', 'eq', 'Cooling Required (Predicted)')
               | list | length == 0 }}
        - alias: "Create calendar event for predicted cooling window"
          action: calendar.create_event
          target:
            entity_id: "{{ calendar_id }}"
          data:
            summary: "Cooling Required (Predicted)"
            description: >
              Predicted indoor peak: {{ repeat.item.peak }}°F (includes humidity adjustment).
              Comfort ceiling: {{ high_threshold }}°F.
              Thermal rate: {{ rate }}, humidity weight: {{ hum_weight }}.
              Current indoor: {{ current_indoor }}°F, current outdoor: {{ current_outdoor }}°F.
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"

  - repeat:
      for_each: "{{ heating_windows }}"
      sequence:
        - alias: "Check for existing heating event"
          action: calendar.get_events
          target:
            entity_id: "{{ calendar_id }}"
          data:
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"
          response_variable: existing_events
        - alias: "Create heating event only if not already present"
          condition: template
          value_template: >
            {{ existing_events[calendar_id].events
               | selectattr('summary', 'eq', 'Heating Required (Predicted)')
               | list | length == 0 }}
        - alias: "Create calendar event for predicted heating window"
          action: calendar.create_event
          target:
            entity_id: "{{ calendar_id }}"
          data:
            summary: "Heating Required (Predicted)"
            description: >
              Predicted indoor trough: {{ repeat.item.trough }}°F.
              Comfort floor: {{ low_threshold }}°F.
              Thermal rate: {{ rate }}.
              Current indoor: {{ current_indoor }}°F, current outdoor: {{ current_outdoor }}°F.
            start_date_time: "{{ repeat.item.start }}"
            end_date_time: "{{ repeat.item.end }}"

  - condition: template
    value_template: "{{ cooling_windows | length > 0 or heating_windows | length > 0 }}"

  - alias: "Send forecast notification"
    action: notify.send_message
    target:
      device_id: "{{ mobile_app }}"
    data:
      title: "HVAC Prediction Update"
      message: >
        {% if cooling_windows | length > 0 %}
        Cooling likely needed during {{ cooling_windows | length }} window(s):
        {% for w in cooling_windows %}{{ as_datetime(w.start) | as_timestamp | timestamp_custom('%-m/%-d %-I%p') }}–{{ as_datetime(w.end) | as_timestamp | timestamp_custom('%-I%p') }} (peak {{ w.peak }}°F){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
        {% if heating_windows | length > 0 %}
        Heating likely needed during {{ heating_windows | length }} window(s):
        {% for w in heating_windows %}{{ as_datetime(w.start) | as_timestamp | timestamp_custom('%-m/%-d %-I%p') }}–{{ as_datetime(w.end) | as_timestamp | timestamp_custom('%-I%p') }} (trough {{ w.trough }}°F){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
        Current indoor: {{ current_indoor }}°F, outdoor: {{ current_outdoor }}°F.

mode: single
