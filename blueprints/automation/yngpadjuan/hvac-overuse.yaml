blueprint:
  name: HVAC Overuse Guard
  author: yngpadjuan
  homeassistant:
    min_version: "2024.10.0"
  description: >
    When the HVAC setpoint has been lower than the room temperature sensor for longer than
    the overuse threshold, raise the setpoint and run the fan to allow the system to recover.
  domain: automation
  input:
    hvac_entity:
      name: HVAC System
      description: "The climate entity to monitor and adjust."
      selector:
        entity:
          domain: climate

    input_mobile_app:
      name: Mobile App
      description: "Select the mobile app to receive notifications."
      selector:
        device:
          integration: mobile_app

    overuse_threshold:
      name: Overuse Threshold
      description: "How many hours the setpoint must remain below room temperature before acting."
      default: 8
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: hours

    input_run_fan_time:
      name: Fan Run Time
      description: "How many hours to run the fan after raising the setpoint."
      default: 4
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: hours

trigger:
  - platform: template
    value_template: >
      {% set setpoint = state_attr(hvac_id, 'temperature') | float(none) %}
      {% set setpoint_high = state_attr(hvac_id, 'target_temp_high') | float(none) %}
      {% set effective_setpoint = setpoint if setpoint is not none else setpoint_high %}
      {% set room = state_attr(hvac_id, 'current_temperature') | float(none) %}
      {{ effective_setpoint is not none and room is not none and room > effective_setpoint }}
    variables:
      hvac_id: !input hvac_entity
    for:
      hours: !input overuse_threshold

condition: []

actions:
  - variables:
      hvac_id: !input hvac_entity
      fan_hours: !input input_run_fan_time
      mobile_app: !input input_mobile_app
  
  - alias: Sending Notification
    action: notify.send_message
    target:
      device_id: "{{ mobile_app }}"
    data:
      title: "HVAC Overuse Detected"
      message: "Changing to Eco mode and running fan for {{ fan_hours }} hours."
  
  - alias: Set HVAC to Eco mode
    action: climate.set_preset_mode
    target:
      entity_id: "{{ hvac_id }}"
    data:
      preset_mode: eco
  
  - alias: Switch to fan mode
    target:
      entity_id: "{{ hvac_id }}"
    data:
      fan_mode: "on"
    action: climate.set_fan_mode
  
  - alias: Run fan for configured duration
    delay:
      hours: "{{ fan_hours }}"
  
  - alias: Stop fan mode
    target:
      entity_id: "{{ hvac_id }}"
    data:
      fan_mode: "off"
    action: climate.set_fan_mode
  
  - alias: Restore previous HVAC mode
    action: climate.set_preset_mode
    target:
      entity_id: "{{ hvac_id }}"
    data:
      preset_mode: none

mode: single
