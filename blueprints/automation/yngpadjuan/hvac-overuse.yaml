blueprint:
  name: HVAC Overuse Guard
  author: yngpadjuan
  homeassistant:
    min_version: "2024.10.0"
  description: >
    When the HVAC setpoint has been lower than the room temperature sensor for longer than
    the overuse threshold, raise the setpoint and run the fan to allow the system to recover.
  domain: automation
  input:
    hvac_entity:
      name: HVAC System
      description: "The climate entity to monitor and adjust."
      selector:
        entity:
          domain: climate

    input_temperature_sensor:
      name: Room Temperature Sensor
      description: >
        Temperature sensor to monitor the room temperature. This can help provide context
        for HVAC usage and identify if the system is working harder than necessary.

        Note: This is an additional sensor inside your room usually next to your favourite
        spot. Thermostats or their integration (e.g. Z2M or ZHA) except Tado should provide
        a separate calibration entity.
      selector:
        entity:
          filter:
            - domain:
                - sensor
              device_class:
                - temperature
          multiple: false

    overuse_threshold:
      name: Overuse Threshold
      description: "How many hours the setpoint must remain below room temperature before acting."
      default: 8
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: hours

    input_temperature_increase:
      name: Temperature Increase
      description: >
        How many degrees to raise the HVAC setpoint when overuse is detected.
        Enter the value in your thermostat's native unit (°C or °F).
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 0.5

    input_run_fan_time:
      name: Fan Run Time
      description: "How many hours to run the fan after raising the setpoint."
      default: 4
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: hours

    input_fan_mode:
      name: Fan HVAC Mode
      description: "The HVAC mode to activate while the fan runs. Choose the mode your thermostat uses for fan_mode circulation."
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
          custom_value: true

trigger:
  - platform: template
    value_template: >
      {% set setpoint = states(hvac_id.set_temperature) | float(none) %}
      {% set room = states(sensor_id) | float(none) %}
      {{ setpoint is not none and room is not none and room > setpoint }}
    variables:
      hvac_id: !input hvac_entity
      sensor_id: !input input_temperature_sensor
    for:
      hours: !input overuse_threshold

condition: []

action:
  - variables:
      hvac_id: !input hvac_entity
      delta: !input input_temperature_increase
      fan: !input input_fan_mode
      fan_hours: !input input_run_fan_time
      current_setpoint: "{{ states(hvac_id.set_temperature) | float(0) }}"
      previous_mode: "{{ states(hvac_id) }}"
  - condition: template
    value_template: "{{ current_setpoint > 0 }}"
  - alias: "Raise the HVAC setpoint"
    service: climate.set_temperature
    target:
      entity_id: "{{ hvac_id }}"
    data:
      temperature: "{{ current_setpoint + delta }}"
      hvac_mode: "{{ previous_mode }}"
  - alias: "Switch to fan mode"
    service: climate.set_hvac_mode
    target:
      entity_id: "{{ hvac_id }}"
    data:
      fan_mode: "{{ fan }}"
  - alias: "Run fan for configured duration"
    delay:
      hours: "{{ fan_hours / 8 }}"
  - alias: "Restore previous HVAC mode"
    service: climate.set_hvac_mode
    target:
      entity_id: "{{ hvac_id }}"
    data:
      temperature: "{{ current_setpoint }}"
      hvac_mode: "{{ previous_mode }}"

mode: single
